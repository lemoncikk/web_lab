<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторная работа №1</title>
    <script src="../js/script.js" defer></script>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <p>Ведмедюк Антон Вариант 12687</p>
    </header>
    <div class="input-part">
        <form action="" id="form">
            <label for="x">Введите координату X:</label>
            <select name="x-cord" id="x">
                <option value="-5">-5</option>
                <option value="-4">-4</option>
                <option value="-3">-3</option>
                <option value="-2">-2</option>
                <option value="-1">-1</option>
                <option value="0">0</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
            </select>
            <label for="y">Введите координату Y:</label>
            <input id="y" type="text" placeholder="-2.0">
            <div class="r-group">
                <label>Введите параметр R</label>
                <label>
                    <input type="radio" name="r-group" value="1">
                    <span>1</span>
                </label>
                <label>
                    <input type="radio" name="r-group" value="1.5">
                    <span>1.5</span>
                </label>
                <label>
                    <input type="radio" name="r-group" value="2.0">
                    <span>2.0</span>
                </label>
                <label>
                    <input type="radio" name="r-group" value="2.5">
                    <span>2.5</span>
                </label>
                <label>
                    <input type="radio" name="r-group" value="3">
                    <span>3</span>
                </label>
            </div>
        </form>
    </div>
    <div class="canvas-part">
        <canvas width="500" height="500"></canvas>
    </div>
    <div class="table-part"></div>
</body>
</html>
