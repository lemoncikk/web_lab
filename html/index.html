<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторная работа №1</title>
    <script type="module" src="../js/script.js" defer></script>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<header>
    <p>Ведмедюк Антон Вариант 12687</p>
</header>
<div class="input-part">
    <form action="" id="form">
        <div class="field">
            <label for="x">Выберите координату X:</label>
            <select name="x-cord" id="x">
                <option value="-5">-5</option>
                <option value="-4">-4</option>
                <option value="-3">-3</option>
                <option value="-2">-2</option>
                <option value="-1">-1</option>
                <option value="0">0</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
            </select>
        </div>
        <div class="field">
            <label for="y">Введите координату Y:</label>
            <input id="y" type="text" placeholder="-2.0">
        </div>
        <div class="field r-group">
            <label>Выберите параметр R: </label>
            <div class="radios">
                <label>
                    <input type="radio" name="r-group" value="1" checked>
                    <span>1</span>
                </label>
                <label>
                    <input type="radio" name="r-group" value="1.5">
                    <span>1.5</span>
                </label>
                <label>
                    <input type="radio" name="r-group" value="2.0">
                    <span>2.0</span>
                </label>
                <label>
                    <input type="radio" name="r-group" value="2.5">
                    <span>2.5</span>
                </label>
                <label>
                    <input type="radio" name="r-group" value="3">
                    <span>3</span>
                </label>
            </div>
        </div>
        <div class="field">
            <button id="reset-form-btn" type="reset">Сбросить форму</button>
            <button id="submit-form-btn" type="submit">Отобразить данные</button>
        </div>
    </form>
</div>
<div class="table-part">
    <table class="tb">
        <caption>
            Result table
        </caption>
        <thead>
            <tr>
                <th>X</th>
                <th>Y</th>
                <th>R</th>
                <th>Time</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="t-body">

        </tbody>
        <tfoot>

        </tfoot>
    </table>
</div>
<div class="canvas-part">
    <canvas width="500" height="500" id="plane"></canvas>
    <div class="buttons">
        <button id="reset-plane-btn">Сбросить график</button>
    </div>
</div>

</body>
</html>
